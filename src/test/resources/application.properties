spring.application.name=oms

# Spring Kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.bootstrap-servers=localhost:9092
#spring.kafka.bootstrap-servers=kafka1:29092

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.initialization-mode=always
spring.datasource.initialize=true
spring.datasource.continue-on-error=true


# SQL
#spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=ALWAYS

spring.docker.compose.skip.in-tests=false
spring.docker.compose.file=compose-test.yaml
#spring.docker.compose.profiles.active=myprofile


# kafka setup
oms.kafka.topics.command.name=order-command
oms.kafka.topics.command.number-of-partition=5
oms.kafka.topics.command.number-of-replica=1
oms.kafka.topics.event.name=order-event
oms.kafka.topics.event.number-of-partition=1
oms.kafka.topics.event.number-of-replica=1
oms.kafka.topics.proposal.name=order-proposal
oms.kafka.topics.proposal.number-of-partition=1
oms.kafka.topics.proposal.number-of-replica=1
oms.kafka.topics.persist.name=persistence
oms.kafka.topics.persist.number-of-partition=1
oms.kafka.topics.persist.number-of-replica=1
oms.kafka.topics.account-info.name=account-info
oms.kafka.topics.account-info.number-of-partition=1
oms.kafka.topics.account-info.number-of-replica=1
oms.kafka.group-id=oms-test

oms.kafka.symbol=SOLUSDT
oms.kafka.accounts.account1.account-key=account1
oms.kafka.accounts.account1.partition-id=1
oms.kafka.accounts.account1.category=
oms.kafka.accounts.account1.account-type=
oms.kafka.accounts.account1.name=
oms.kafka.accounts.account2.account-key=account2
oms.kafka.accounts.account2.partition-id=2
oms.kafka.accounts.account2.category=
oms.kafka.accounts.account2.account-type=
oms.kafka.accounts.account2.name=


