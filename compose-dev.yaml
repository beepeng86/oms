services:
  oms:
#    build:
#      context: .
#      dockerfile: docker/oms/Dockerfile
    image: beepeng86/oms
    ports:
      - "8081:8080"
    volumes:
      - /logs:/logs
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5479/dev01'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=1234'
      - 'SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka1:19092'
    depends_on:
      - kafka1
    networks:
      - tnet
#  algo:
